{% extends "base.html" %}

{% block title %}个人中心{% endblock %}

{% block page_header %}个人中心{% block page_title %}{% endblock %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="glass-card p-4 p-md-5 border-0 shadow-sm">
            <div class="d-flex align-items-center gap-4 mb-5 border-bottom pb-4">
                <div class="rounded-circle bg-primary-light text-primary d-flex align-items-center justify-content-center fw-bold fs-2" style="width: 80px; height: 80px;" id="profileAvatarChar">
                    U
                </div>
                <div>
                    <h4 class="fw-bold m-0 text-slate-800" id="profileNameHeader">加载中...</h4>
                    <span class="badge bg-primary-light text-primary rounded-pill px-3 py-1.5 fw-semibold mt-2 small" id="profileRoleBadge">角色</span>
                </div>
            </div>

            <form id="profileForm" novalidate>
                <div class="row g-4">
                    <!-- 只读信息项 -->
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-semibold small">登录账号</label>
                        <input type="text" class="form-control bg-light" id="profileAccount" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-semibold small" id="noLabel">学号/工号</label>
                        <input type="text" class="form-control bg-light" id="profileNo" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-semibold small">账号状态</label>
                        <input type="text" class="form-control bg-light" id="profileStatus" value="正常" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-semibold small">注册时间</label>
                        <input type="text" class="form-control bg-light" id="profileCreatedAt" disabled>
                    </div>

                    <hr class="my-4 border-secondary-subtle opacity-50">

                    <!-- 可编辑信息项 -->
                    <div class="col-md-6">
                        <label for="profileName" class="form-label fw-bold text-slate-700">姓名</label>
                        <input type="text" class="form-control" id="profileName" required placeholder="请输入您的真实姓名">
                        <div class="invalid-feedback">请填写您的姓名</div>
                    </div>
                    <div class="col-md-6">
                        <label for="profilePhone" class="form-label fw-bold text-slate-700">联系电话</label>
                        <input type="tel" class="form-control" id="profilePhone" required pattern="^1[3-9]\d{9}$" placeholder="请输入11位手机号码">
                        <div class="invalid-feedback">请输入有效的11位手机号</div>
                    </div>
                </div>

                <div class="d-flex gap-3 justify-content-end mt-5 border-top pt-4">
                    <button type="submit" class="btn btn-primary px-5 rounded-3 glow-btn fw-semibold">
                        <i class="bi bi-check-lg me-2"></i>保存修改
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', async function () {
        // 1. 加载并渲染个人信息
        await loadProfileData();

        // 2. 表单提交更新数据
        const form = document.getElementById('profileForm');
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            form.classList.remove('was-validated');

            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            showLoader();
            const name = document.getElementById('profileName').value.trim();
            const phone = document.getElementById('profilePhone').value.trim();

            try {
                // 调用 API 1.4：更新个人信息
                const res = await api.put('/accounts/profile/', {
                    name: name,
                    phone: phone
                });

                showToast(res.message || '个人信息已更新！', 'success');

                // 3. 动态更新本地缓存中存储的用户名，以便顶部导航栏同步改变
                const cachedUser = JSON.parse(localStorage.getItem('dormfix_user'));
                if (cachedUser) {
                    cachedUser.name = name;
                    localStorage.setItem('dormfix_user', JSON.stringify(cachedUser));
                    
                    // 动态更新页面上的 Header 和导航栏名字
                    document.getElementById('profileNameHeader').textContent = name;
                    document.getElementById('navUserName').textContent = name;
                    document.getElementById('profileAvatarChar').textContent = name.charAt(0);
                    document.getElementById('userAvatarChar').textContent = name.charAt(0);
                }

            } catch (error) {
                if (error && typeof error === 'object') {
                    showToast('保存失败，请检查输入格式', 'error');
                    if (error.name) {
                        document.getElementById('profileName').classList.add('is-invalid');
                    }
                    if (error.phone) {
                        document.getElementById('profilePhone').classList.add('is-invalid');
                    }
                } else {
                    showToast('保存信息失败，请重试', 'error');
                }
            } finally {
                hideLoader();
            }
        });
    });

    // 拉取用户档案接口
    async function loadProfileData() {
        showLoader();
        try {
            // 调用 API 1.3：获取个人信息
            const profile = await api.get('/accounts/profile/');
            
            // 渲染数据
            document.getElementById('profileNameHeader').textContent = profile.name;
            document.getElementById('profileAvatarChar').textContent = profile.name.charAt(0);
            
            const roleMap = {
                'student': '学生用户',
                'maintainer': '维修人员',
                'admin': '宿舍管理员'
            };
            document.getElementById('profileRoleBadge').textContent = roleMap[profile.role] || '未知角色';
            document.getElementById('noLabel').textContent = profile.role === 'student' ? '学号' : '工号';
            
            // 只读项
            document.getElementById('profileAccount').value = profile.account;
            document.getElementById('profileNo').value = profile.student_or_staff_no;
            document.getElementById('profileStatus').value = profile.status === 1 ? '正常' : '已禁用';
            document.getElementById('profileCreatedAt').value = new Date(profile.created_at).toLocaleString();
            
            // 可编辑项
            document.getElementById('profileName').value = profile.name;
            document.getElementById('profilePhone').value = profile.phone;

        } catch (e) {
            showToast('加载个人档案信息失败', 'error');
        } finally {
            hideLoader();
        }
    }
</script>
{% endblock %}
