<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DormFix - 登录</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
    
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 全局加载等待遮罩 -->
    <div class="loading-overlay" id="loginLoader">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">登录中...</span>
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-card glass-card shadow-lg">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary-light text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                    <i class="bi bi-tools fs-2"></i>
                </div>
                <h3 class="fw-bold text-primary m-0">DormFix</h3>
                <p class="text-muted mt-2">宿舍报修与维修进度管理系统</p>
            </div>

            <!-- 登录错误通告栏 -->
            <div class="alert alert-danger d-none" id="errorAlert" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="errorMessage">账号或密码错误</span>
            </div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="account" class="form-label fw-semibold">登录账号</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary-subtle">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0" id="account" placeholder="账号 / 学号 / 工号" required>
                        <div class="invalid-feedback">请输入账号、学号或工号</div>
                    </div>
                    <small class="text-muted">支持使用账号、学号或工号登录</small>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">登录密码</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary-subtle">
                            <i class="bi bi-shield-lock text-muted"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 ps-0" id="password" placeholder="请输入密码" required>
                        <button class="btn btn-outline-secondary border-start-0 border-secondary-subtle" type="button" id="togglePassword">
                            <i class="bi bi-eye text-muted"></i>
                        </button>
                        <div class="invalid-feedback">请输入您的密码</div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold glow-btn rounded-3">
                    安全登录
                </button>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AJAX Fetch 工具类 -->
    <script src="/static/js/api.js"></script>
    
    <script>
        // 如果 localStorage 中已有 token，直接跳过登录验证重定向
        const currentToken = localStorage.getItem('dormfix_token');
        const currentUserJson = localStorage.getItem('dormfix_user');
        if (currentToken && currentUserJson) {
            const user = JSON.parse(currentUserJson);
            redirectUser(user.role);
        }

        // 控制显示/隐藏密码
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        togglePasswordBtn.addEventListener('click', function() {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            this.querySelector('i').className = isPassword ? 'bi bi-eye-slash text-muted' : 'bi bi-eye text-muted';
        });

        // 表单提交异步登录逻辑
        const loginForm = document.getElementById('loginForm');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        const loginLoader = document.getElementById('loginLoader');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // 清理状态
            errorAlert.classList.add('d-none');
            loginForm.classList.remove('was-validated');

            // 基础校验
            if (!loginForm.checkValidity()) {
                loginForm.classList.add('was-validated');
                return;
            }

            const account = document.getElementById('account').value.trim();
            const password = passwordInput.value;

            // 显示加载器
            loginLoader.classList.add('show');

            try {
                // 根据接口 1.1 文档约定发起登录
                const data = await api.post('/accounts/login/', {
                    account: account,
                    password: password
                });

                // 登录成功存入本地缓存（使用 localStorage 支持多标签页共享）
                localStorage.setItem('dormfix_token', data.token);
                localStorage.setItem('dormfix_user', JSON.stringify(data.user));

                // 角色页面重定向
                redirectUser(data.user.role);

            } catch (error) {
                // 捕获 API 返回的错误（字段级校验或自定义 error 信息）
                errorAlert.classList.remove('d-none');
                loginForm.classList.add('was-validated');

                if (error && error.error) {
                    errorMessage.textContent = error.error;
                } else if (error && error.detail) {
                    errorMessage.textContent = error.detail;
                } else if (error && typeof error === 'object') {
                    // 如果是表单验证字段型错误，展开展示
                    const errorMsgs = [];
                    for (const key in error) {
                        if (Array.isArray(error[key])) {
                            errorMsgs.push(`${error[key].join(', ')}`);
                        }
                    }
                    errorMessage.textContent = errorMsgs.length > 0 ? errorMsgs.join('; ') : '服务器返回错误，登录失败';
                } else {
                    errorMessage.textContent = '网络请求超时或接口异常';
                }
            } finally {
                loginLoader.classList.remove('show');
            }
        });

        // 统一重定向跳转控制
        function redirectUser(role) {
            if (role === 'student') {
                window.location.href = '/student/orders/';
            } else if (role === 'admin') {
                window.location.href = '/admin/pending-review/';
            } else if (role === 'maintainer') {
                window.location.href = '/maintainer/tasks/';
            } else {
                errorAlert.classList.remove('d-none');
                errorMessage.textContent = '无法识别的用户角色权限';
            }
        }
    </script>
</body>
</html>
