<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DormFix - {% block title %}宿舍报修与维修进度管理系统{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="/static/css/style.css?v=2" rel="stylesheet">
    
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- 全局加载等待遮罩 -->
    <div class="loading-overlay" id="globalLoader">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">加载中...</span>
        </div>
    </div>

    <!-- 全局通知 Toast 容器 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1050;">
        <div id="globalToast" class="toast glass-card" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header border-0 bg-transparent">
                <i class="bi bi-info-circle-fill text-primary me-2" id="toastIcon"></i>
                <strong class="me-auto text-primary" id="toastTitle">系统提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body pt-0 fw-medium" id="toastBody">
                提示内容
            </div>
        </div>
    </div>

    <div class="wrapper">
        <!-- 侧边栏 Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header d-flex align-items-center justify-content-between">
                <h4 class="m-0 fw-bold text-primary"><i class="bi bi-tools me-2"></i>DormFix</h4>
                <button type="button" id="sidebarCollapseBtn" class="btn btn-link text-primary d-md-none p-0">
                    <i class="bi bi-x-lg fs-5"></i>
                </button>
            </div>

            <!-- 根据登录角色通过 JS 动态显示对应菜单 -->
            <ul class="list-unstyled components" id="sidebarMenu">
                <!-- 预置的空白菜单，由底部的 JS 渲染 -->
            </ul>
        </nav>

        <!-- 主要内容区域 Content -->
        <div id="content">
            <!-- 顶部导航栏 Navbar -->
            <nav class="navbar navbar-expand-lg navbar-light glass-nav px-4 py-3 rounded-4 mb-4">
                <div class="container-fluid p-0">
                    <button type="button" id="sidebarCollapse" class="btn btn-outline-primary rounded-3 me-3">
                        <i class="bi bi-list"></i>
                    </button>
                    
                    <h5 class="m-0 fw-semibold text-secondary d-none d-sm-inline-block">
                        {% block page_header %}控制台{% endblock %}
                    </h5>

                    <div class="ms-auto d-flex align-items-center gap-3">
                        <div class="text-end d-none d-md-block">
                            <h6 class="m-0 fw-semibold" id="navUserName">加载中...</h6>
                            <small class="text-muted" id="navUserRole">角色</small>
                        </div>
                        <div class="dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <div class="rounded-circle bg-primary-light text-primary d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px;" id="userAvatarChar">
                                    U
                                </div>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end glass-card border-0 shadow-lg mt-2 p-2" style="min-width: 200px;">
                                <li>
                                    <a class="dropdown-item rounded-3 py-2" href="#" id="menuProfileLink">
                                        <i class="bi bi-person me-2"></i>个人中心
                                    </a>
                                </li>
                                <li><hr class="dropdown-divider bg-transparent border-top border-secondary-subtle"></li>
                                <li>
                                    <button class="dropdown-item text-danger rounded-3 py-2" id="logoutButton">
                                        <i class="bi bi-box-arrow-right me-2"></i>退出登录
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- 页面内容插槽 -->
            <div class="container-fluid p-0">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- API 异步交互工具类（时间戳强制刷新缓存）-->
    <script>
        document.write('<script src="/static/js/api.js?t=' + Date.now() + '"><\/script>');
    </script>

    <!-- 全局工具函数 -->
    <script>
        // HTML 转义，防止 XSS
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>

    <!-- 全局状态映射 -->
    <script>
        const STATUS_MAP = {
            'pending_review': { text: '待审核', class: 'bg-warning text-dark' },
            'pending_dispatch': { text: '待派单', class: 'bg-info text-white' },
            'assigned': { text: '已派单', class: 'bg-primary text-white' },
            'in_progress': { text: '处理中', class: 'bg-primary text-white' },
            'pending_confirm': { text: '已完成待确认', class: 'bg-info text-white' },
            'completed': { text: '已完成', class: 'bg-success text-white' },
            'evaluated': { text: '已评价', class: 'bg-secondary text-white' },
            'rejected': { text: '已驳回', class: 'bg-danger text-white' },
            'cancelled': { text: '已撤销', class: 'bg-dark text-white' }
        };
    </script>

    <!-- 全局 Layout 脚本 -->
    <script>
        // 安全读取 localStorage 用户数据（支持多标签页共享）
        function getStoredUser() {
            try {
                const json = localStorage.getItem('dormfix_user');
                if (!json) return null;
                return JSON.parse(json);
            } catch (e) {
                localStorage.removeItem('dormfix_user');
                localStorage.removeItem('dormfix_token');
                return null;
            }
        }

        // 1. 验证用户是否登录，未登录则拦截至登录页
        const token = localStorage.getItem('dormfix_token');
        const currentUser = getStoredUser();

        if (!token || !currentUser) {
            if (!window.location.pathname.endsWith('/login/')) {
                window.location.href = '/login/';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            // 2. 侧边栏折叠交互
            const sidebar = document.getElementById('sidebar');
            const collapseBtn = document.getElementById('sidebarCollapse');
            const collapseBtnMobile = document.getElementById('sidebarCollapseBtn');
            
            if (collapseBtn) {
                collapseBtn.addEventListener('click', function () {
                    sidebar.classList.toggle('active');
                });
            }
            if (collapseBtnMobile) {
                collapseBtnMobile.addEventListener('click', function () {
                    sidebar.classList.add('active');
                });
            }

            // 3. 填充用户信息与导航栏
            if (currentUser) {
                document.getElementById('navUserName').textContent = currentUser.name;
                
                const roleMap = {
                    'student': '学生用户',
                    'maintainer': '维修人员',
                    'admin': '宿舍管理员'
                };
                document.getElementById('navUserRole').textContent = roleMap[currentUser.role] || '未知角色';
                document.getElementById('userAvatarChar').textContent = currentUser.name.charAt(0);
                
                // 3. 动态绑定个人信息页面路径
                const profileLink = document.getElementById('menuProfileLink');
                if (profileLink) {
                    profileLink.href = '/profile/';
                }

                // 4. 动态生成符合当前角色的侧边栏菜单
                renderSidebarMenu(currentUser.role);
            }

            // 5. 退出登录事件
            const logoutBtn = document.getElementById('logoutButton');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async function () {
                    showLoader();
                    try {
                        await api.post('/accounts/logout/');
                    } catch (e) {
                        console.error('Logout error, forcing clear local data.', e);
                    } finally {
                        localStorage.removeItem('dormfix_token');
                        localStorage.removeItem('dormfix_user');
                        hideLoader();
                        window.location.href = '/login/';
                    }
                });
            }
        });

        // 动态侧边栏渲染逻辑
        function renderSidebarMenu(role) {
            const menuContainer = document.getElementById('sidebarMenu');
            let menuHTML = '';

            const currentPath = window.location.pathname;

            if (role === 'student') {
                menuHTML = `
                    <li class="${currentPath.includes('/student/orders') ? 'active' : ''}">
                        <a href="/student/orders/"><i class="bi bi-list-task fs-5"></i>我的工单</a>
                    </li>
                    <li class="${currentPath.includes('/student/repairs/create') ? 'active' : ''}">
                        <a href="/student/repairs/create/"><i class="bi bi-file-earmark-plus fs-5"></i>提交报修</a>
                    </li>
                `;
            } else if (role === 'admin') {
                menuHTML = `
                    <li class="${currentPath.includes('/admin/pending-review') ? 'active' : ''}">
                        <a href="/admin/pending-review/"><i class="bi bi-clipboard-check fs-5"></i>工单审核</a>
                    </li>
                    <li class="${currentPath.includes('/admin/pending-dispatch') ? 'active' : ''}">
                        <a href="/admin/pending-dispatch/"><i class="bi bi-truck fs-5"></i>派发任务</a>
                    </li>
                    <li class="${currentPath.includes('/admin/complaints') ? 'active' : ''}">
                        <a href="/admin/complaints/"><i class="bi bi-chat-square-quote fs-5"></i>投诉处理</a>
                    </li>
                    <li class="${currentPath.includes('/admin/users') ? 'active' : ''}">
                        <a href="/admin/users/"><i class="bi bi-people fs-5"></i>用户管理</a>
                    </li>
                    <li class="${currentPath.includes('/admin/dashboard') ? 'active' : ''}">
                        <a href="/admin/dashboard/"><i class="bi bi-graph-up-arrow fs-5"></i>统计报表</a>
                    </li>
                `;
            } else if (role === 'maintainer') {
                menuHTML = `
                    <li class="${currentPath.includes('/maintainer/tasks') ? 'active' : ''}">
                        <a href="/maintainer/tasks/"><i class="bi bi-briefcase fs-5"></i>我的任务</a>
                    </li>
                `;
            }

            menuContainer.innerHTML = menuHTML;
        }

        // 全局 Loader 控制
        function showLoader() {
            document.getElementById('globalLoader').classList.add('show');
        }

        function hideLoader() {
            document.getElementById('globalLoader').classList.remove('show');
        }

        // 全局 Notification Toast 提示
        function showToast(message, type = 'primary') {
            const toastEl = document.getElementById('globalToast');
            const toastTitle = document.getElementById('toastTitle');
            const toastIcon = document.getElementById('toastIcon');
            const toastBody = document.getElementById('toastBody');
            
            toastBody.textContent = message;
            
            // 设定颜色和图标样式
            toastIcon.className = `bi me-2 fs-5 `;
            toastTitle.className = `me-auto fw-bold `;
            
            if (type === 'success') {
                toastIcon.classList.add('bi-check-circle-fill', 'text-success');
                toastTitle.classList.add('text-success');
                toastTitle.textContent = '操作成功';
            } else if (type === 'error') {
                toastIcon.classList.add('bi-exclamation-triangle-fill', 'text-danger');
                toastTitle.classList.add('text-danger');
                toastTitle.textContent = '发生错误';
            } else {
                toastIcon.classList.add('bi-info-circle-fill', 'text-primary');
                toastTitle.classList.add('text-primary');
                toastTitle.textContent = '系统提示';
            }
            
            const toast = new bootstrap.Toast(toastEl, { delay: 4000 });
            toast.show();
        }
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
